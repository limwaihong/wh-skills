# When you publish a GitHub Release (tag like v0.1.5):
# 1. Checks the tag matches the version in package.json
# 2. Publishes the package to npm
# 3. Attaches one ZIP per skill to the Release (for Claude app users)
#
# One-time setup: add an npm access token as a repo secret named NPM_TOKEN
# (GitHub repo → Settings → Secrets and variables → Actions → New repository secret).

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build skill ZIPs
        run: |
          mkdir -p dist
          cd skills
          for d in */; do
            name="${d%/}"
            zip -rq "../dist/${name}.zip" "$name"
          done

      - name: Attach ZIPs to the Release
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
