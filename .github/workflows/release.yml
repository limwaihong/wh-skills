# When you publish a GitHub Release (tag like v0.2.0):
# 1. Checks the tag matches the version in package.json
# 2. Publishes the package to npm, unless that version is already on npm
# 3. Attaches one ZIP per skill to the Release (for Claude app users)
#
# npm publish uses trusted publishing (OIDC), so no npm token is stored.
# One-time setup on npmjs.com: wh-skills → Settings → Trusted publishing →
# GitHub Actions, with user limwaihong, repo wh-skills, workflow release.yml.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Trusted publishing needs Node 22.14+ and npm 11.5.1+.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      # A version published from a maintainer's machine is skipped, so the ZIPs still attach.
      - name: Publish to npm
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm. Skipping publish."
          else
            npm publish --access public
          fi

      - name: Build skill ZIPs
        run: |
          mkdir -p dist
          cd skills
          for d in */; do
            name="${d%/}"
            zip -rq "../dist/${name}.zip" "$name"
          done

      - name: Attach ZIPs to the Release
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
